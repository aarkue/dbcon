[package]
name = "dbcon"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Universal connector for tabular data sources (PostgreSQL, SQLite, CSV) with schema discovery and normalised row values."
repository = "https://github.com/aarkue/dbcon"
readme = "README.md"
keywords = ["database", "postgres", "sqlite", "csv", "schema"]
categories = ["database"]

[dependencies]
sqlx = { git = "https://github.com/aarkue/sqlx-fix.git", branch = "sqlite3-fix", features = [ "runtime-tokio", "tls-native-tls", "all-databases", "chrono" ] }
tokio = { version = "1.49.0", features = ["full"] }
sea-schema = { git = "https://github.com/SeaQL/sea-schema", version = "0.17.0-rc.17", features = ["mysql", "postgres", "sqlite", "sqlx-postgres", "sqlx-sqlite", "discovery", "probe","runtime-tokio-native-tls"] }
anyhow = "1.0"
futures = "0.3"
csv = "1.4.0"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
chrono = { version = "0.4.43", features = ["serde"] }

[dev-dependencies]
dotenvy = "0.15"

[patch.crates-io]
sqlx = { git =  "https://github.com/aarkue/sqlx-fix.git", branch = "sqlite3-fix"}