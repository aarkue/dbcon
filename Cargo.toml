[package]
name = "dbcon"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Universal connector for tabular data sources (PostgreSQL, SQLite, CSV, Parquet) with schema discovery and normalised row values."
repository = "https://github.com/aarkue/dbcon"
readme = "README.md"
keywords = ["database", "postgres", "sqlite", "csv", "parquet"]
categories = ["database"]

[dependencies]
sqlx = { git = "https://github.com/aarkue/sqlx-fix.git", branch = "sqlite3-fix", default-features = false, features = [
    "runtime-tokio",
    "tls-native-tls",
    "chrono",
], optional = true }
rusqlite = { version = "0.38", features = [
    "bundled",
    "column_decltype",
], optional = true }
anyhow = "1.0"
futures = { version = "0.3", optional = true }
# Only the PostgreSQL backend is genuinely async
tokio = { version = "1", default-features = false, features = [
    "rt",
], optional = true }
csv = { version = "1.4.0", optional = true }
parquet = { version = "58", optional = true }
# Only to hand parquet an in-memory `ChunkReader`; `parquet` already depends on it.
bytes = { version = "1", optional = true }
# In-memory parquet: `bytes::Bytes` is what `parquet` itself implements `ChunkReader` for.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.43", features = ["serde"] }

[features]
default = []
sql = ["dep:sqlx", "dep:futures", "dep:tokio"]
sqlite = ["dep:rusqlite"]
postgres = ["sql", "sqlx/postgres"]
csv = ["dep:csv"]
parquet = ["dep:parquet", "dep:bytes"]

[dev-dependencies]
dotenvy = "0.15"
serde_json = "1"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[[test]]
name = "corpus"
harness = false
required-features = ["sqlite"]
